<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ff3600'><path d='M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 3.1C2.1 11.3 2 11.6 2 12v4c0 .6.4 1 1 1h2'/><circle cx='7' cy='17' r='2'/><circle cx='17' cy='17' r='2'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Express GCC Transportation | Premium Car Rental & Fleet</title>
    <!-- Google Fonts: Plus Jakarta Sans for clean commercial look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Instant Theme Hydration to prevent any flash of incorrect theme -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('express_gcc_theme');
          var isDark = saved ? saved === 'dark' : true;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-[#111111] text-gray-900 dark:text-gray-100 font-sans antialiased selection:bg-[#ff3600] selection:text-white transition-colors duration-250">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
